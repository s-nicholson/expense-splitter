
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<style>
body{font-family:var(--font-sans);background:transparent}
.nav-tabs .nav-link{color:var(--color-text-secondary);font-size:14px}
.nav-tabs .nav-link.active{color:var(--color-text-primary);font-weight:500}
.pchip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;border:0.5px solid var(--color-border-secondary);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);user-select:none;margin:2px}
.pchip.sel{background:#E6F1FB;color:#0C447C;border-color:#85B7EB}
.expense-row td{vertical-align:middle;font-size:13px}
.transfer-row td{font-size:14px;vertical-align:middle}
.avatar{width:28px;height:28px;border-radius:50%;background:#E6F1FB;color:#0C447C;font-size:11px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.edit-modal-bg{background:rgba(0,0,0,0.35);border-radius:var(--border-radius-lg);padding:2rem;margin-top:1rem}
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Travel expense splitter</h2>

<div class="p-2">
  <ul class="nav nav-tabs mb-3" id="mainTabs">
    <li class="nav-item"><button class="nav-link active" onclick="showTab('people',this)"><i class="bi bi-users me-1" aria-hidden="true"></i>People</button></li>
    <li class="nav-item"><button class="nav-link" onclick="showTab('expenses',this)"><i class="bi bi-receipt me-1" aria-hidden="true"></i>Expenses</button></li>
    <li class="nav-item"><button class="nav-link" onclick="showTab('settle',this)"><i class="bi bi-arrows-exchange me-1" aria-hidden="true"></i>Settle up</button></li>
  </ul>

  <div id="tab-people">
    <div class="card mb-3">
      <div class="card-body">
        <div class="d-flex gap-2 align-items-center">
          <input type="text" class="form-control form-control-sm" id="person-name" placeholder="Add a person…" style="max-width:200px" onkeydown="if(event.key==='Enter')addPerson()">
          <button class="btn btn-sm btn-outline-primary" onclick="addPerson()"><i class="bi bi-plus" aria-hidden="true"></i> Add</button>
        </div>
      </div>
    </div>
    <div id="people-list" class="d-flex flex-wrap gap-2"></div>
  </div>

  <div id="tab-expenses" style="display:none">
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-2 mb-2">
          <div class="col"><input type="text" class="form-control form-control-sm" id="exp-desc" placeholder="Description" maxlength="50"></div>
          <div class="col-auto"><input type="number" class="form-control form-control-sm" id="exp-amount" placeholder="£ Amount" min="0" step="0.01" style="width:110px"></div>
          <div class="col-auto"><select class="form-select form-select-sm" id="exp-payer" style="width:120px"><option value="">Paid by…</option></select></div>
        </div>
        <div class="mb-2">
          <div class="text-muted mb-1" style="font-size:12px">Split between (blank = everyone):</div>
          <div id="split-chips"></div>
        </div>
        <button class="btn btn-sm btn-outline-primary" onclick="addExpense()"><i class="bi bi-plus" aria-hidden="true"></i> Add expense</button>
      </div>
    </div>

    <div id="edit-modal" style="display:none">
      <div class="edit-modal-bg">
        <div class="fw-500 mb-2" style="font-size:14px">Edit expense</div>
        <div class="row g-2 mb-2">
          <div class="col"><input type="text" class="form-control form-control-sm" id="edit-desc" placeholder="Description"></div>
          <div class="col-auto"><input type="number" class="form-control form-control-sm" id="edit-amount" placeholder="£ Amount" style="width:110px"></div>
          <div class="col-auto"><select class="form-select form-select-sm" id="edit-payer" style="width:120px"></select></div>
        </div>
        <div class="mb-2">
          <div class="text-muted mb-1" style="font-size:12px">Split between:</div>
          <div id="edit-split-chips"></div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-primary" onclick="saveEdit()">Save</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="cancelEdit()">Cancel</button>
        </div>
      </div>
    </div>

    <table class="table table-sm" id="expense-table" style="font-size:13px">
      <thead><tr><th>Description</th><th>Amount</th><th>Paid by</th><th>Split</th><th></th></tr></thead>
      <tbody id="expense-tbody"></tbody>
    </table>
  </div>

  <div id="tab-settle" style="display:none">
    <div id="settle-result"></div>
  </div>
</div>

<script>
let people=[], expenses=[], selectedSplit=new Set(), editId=null, editSplit=new Set();

function showTab(name,btn){
  ['people','expenses','settle'].forEach(t=>document.getElementById('tab-'+t).style.display=t===name?'':'none');
  document.querySelectorAll('.nav-link').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(name==='expenses'){renderSplitChips();renderExpenses();}
  if(name==='settle')renderSettle();
}

function addPerson(){
  const inp=document.getElementById('person-name'), name=inp.value.trim();
  if(!name||people.includes(name))return;
  people.push(name); inp.value='';
  renderPeople(); renderPayerSelect('exp-payer'); renderSplitChips();
}

function removePerson(name){
  people=people.filter(p=>p!==name);
  expenses=expenses.filter(e=>e.payer!==name);
  renderPeople(); renderPayerSelect('exp-payer'); renderSplitChips(); renderExpenses();
}

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}

function renderPeople(){
  document.getElementById('people-list').innerHTML=people.map(p=>`
    <div class="d-flex align-items-center gap-1 border rounded px-2 py-1" style="font-size:13px;background:var(--color-background-primary)">
      <span class="avatar">${initials(p)}</span> ${p}
      <button class="btn btn-link btn-sm p-0 ms-1 text-secondary" onclick="removePerson('${p}')" title="Remove" aria-label="Remove ${p}"><i class="bi bi-x" style="font-size:13px" aria-hidden="true"></i></button>
    </div>`).join('');
}

function renderPayerSelect(id){
  const sel=document.getElementById(id), cur=sel.value;
  sel.innerHTML='<option value="">Paid by…</option>'+people.map(p=>`<option${p===cur?' selected':''}>${p}</option>`).join('');
}

function renderSplitChips(){
  document.getElementById('split-chips').innerHTML=people.map(p=>`<span class="pchip${selectedSplit.has(p)?' sel':''}" onclick="toggleSplit('${p}','add')">${p}</span>`).join('');
}

function toggleSplit(name,mode){
  const s=mode==='add'?selectedSplit:editSplit;
  s.has(name)?s.delete(name):s.add(name);
  mode==='add'?renderSplitChips():renderEditSplitChips();
}

function addExpense(){
  const desc=document.getElementById('exp-desc').value.trim();
  const amount=parseFloat(document.getElementById('exp-amount').value);
  const payer=document.getElementById('exp-payer').value;
  if(!desc||isNaN(amount)||amount<=0||!payer){alert('Fill in all fields.');return;}
  const split=selectedSplit.size>0?[...selectedSplit]:[...people];
  expenses.push({id:Date.now(),desc,amount,payer,split});
  document.getElementById('exp-desc').value='';
  document.getElementById('exp-amount').value='';
  selectedSplit.clear(); renderSplitChips(); renderExpenses();
}

function renderExpenses(){
  const tb=document.getElementById('expense-tbody');
  if(!expenses.length){tb.innerHTML='<tr><td colspan="5" class="text-muted" style="font-size:13px">No expenses yet.</td></tr>';return;}
  tb.innerHTML=expenses.map(e=>`
    <tr class="expense-row">
      <td>${e.desc}</td>
      <td>£${e.amount.toFixed(2)}</td>
      <td>${e.payer}</td>
      <td style="color:var(--color-text-secondary)">${e.split.join(', ')}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-link btn-sm p-0 me-1" onclick="startEdit(${e.id})" title="Edit" aria-label="Edit"><i class="bi bi-pencil" aria-hidden="true"></i></button>
        <button class="btn btn-link btn-sm p-0 text-danger" onclick="removeExpense(${e.id})" title="Delete" aria-label="Delete"><i class="bi bi-trash" aria-hidden="true"></i></button>
      </td>
    </tr>`).join('');
}

function removeExpense(id){expenses=expenses.filter(e=>e.id!==id);renderExpenses();}

function startEdit(id){
  const e=expenses.find(x=>x.id===id);
  if(!e)return;
  editId=id; editSplit=new Set(e.split);
  document.getElementById('edit-desc').value=e.desc;
  document.getElementById('edit-amount').value=e.amount;
  renderPayerSelect('edit-payer');
  document.getElementById('edit-payer').value=e.payer;
  renderEditSplitChips();
  document.getElementById('edit-modal').style.display='';
  document.getElementById('edit-modal').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderEditSplitChips(){
  document.getElementById('edit-split-chips').innerHTML=people.map(p=>`<span class="pchip${editSplit.has(p)?' sel':''}" onclick="toggleSplit('${p}','edit')">${p}</span>`).join('');
}

function saveEdit(){
  const desc=document.getElementById('edit-desc').value.trim();
  const amount=parseFloat(document.getElementById('edit-amount').value);
  const payer=document.getElementById('edit-payer').value;
  if(!desc||isNaN(amount)||amount<=0||!payer)return;
  const split=editSplit.size>0?[...editSplit]:[...people];
  const idx=expenses.findIndex(x=>x.id===editId);
  if(idx>-1) expenses[idx]={id:editId,desc,amount,payer,split};
  editId=null; editSplit=new Set();
  document.getElementById('edit-modal').style.display='none';
  renderExpenses();
}

function cancelEdit(){
  editId=null; editSplit=new Set();
  document.getElementById('edit-modal').style.display='none';
}

function renderSettle(){
  const el=document.getElementById('settle-result');
  if(people.length<2){el.innerHTML='<p class="text-muted">Add at least 2 people first.</p>';return;}
  if(!expenses.length){el.innerHTML='<p class="text-muted">No expenses added yet.</p>';return;}
  const bal={};
  people.forEach(p=>bal[p]=0);
  expenses.forEach(e=>{
    const share=e.amount/e.split.length;
    e.split.forEach(p=>bal[p]-=share);
    bal[e.payer]+=e.amount;
  });
  const pos=[], neg=[];
  Object.entries(bal).forEach(([p,v])=>{
    if(v>0.005)pos.push({p,v});
    else if(v<-0.005)neg.push({p,v:-v});
  });
  const transfers=[];
  const p2=[...pos],n2=[...neg];
  while(p2.length&&n2.length){
    const cr=p2[0],db=n2[0],amt=Math.min(cr.v,db.v);
    transfers.push({from:db.p,to:cr.p,amt});
    cr.v-=amt; db.v-=amt;
    if(cr.v<0.005)p2.shift();
    if(db.v<0.005)n2.shift();
  }
  if(!transfers.length){el.innerHTML='<div class="alert alert-success"><i class="bi bi-circle-check me-1" aria-hidden="true"></i>Everyone is settled up!</div>';return;}
  el.innerHTML=`<table class="table table-sm"><thead><tr><th>From</th><th></th><th>To</th><th class="text-end">Amount</th></tr></thead><tbody>${
    transfers.map(t=>`<tr class="transfer-row">
      <td><span class="avatar me-1">${initials(t.from)}</span>${t.from}</td>
      <td><i class="bi bi-arrow-right text-secondary" aria-hidden="true"></i></td>
      <td><span class="avatar me-1">${initials(t.to)}</span>${t.to}</td>
      <td class="text-end fw-500">£${t.amt.toFixed(2)}</td>
    </tr>`).join('')
  }</tbody></table>`;
}
</script>
